<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>leaderboard-pl</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #111; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    label { display: flex; flex-direction: column; font-size: 14px; gap: 4px; }
    input, select { padding: 6px 8px; font-size: 14px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { border: 1px solid #ccc; padding: 6px; vertical-align: top; }
    th { background: #f5f5f5; position: sticky; top: 0; }
    .muted { color: #555; font-size: 13px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>leaderboard-pl (lokalny podgląd)</h1>
  <div class="muted">Statyczny podgląd pliku <code>wyniki.json</code>. Docelowy Space: <code>adegier/leaderboard-pl</code>. Nic nie jest publikowane przez to zadanie.</div>
  <div class="controls">
    <label>Rodzina<select id="family"><option value="">Wszystkie</option></select></label>
    <label>Benchmark<select id="benchmark"><option value="">Wszystkie</option></select></label>
    <label>Model<input id="model" placeholder="filtr modelu"></label>
  </div>
  <div id="count" class="muted"></div>
  <table>
    <thead><tr><th>Model</th><th>Rodzina</th><th>Benchmark</th><th>Metryka</th><th>Wynik</th><th>Status</th><th>Źródło</th></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <script>
    const state = { rows: [] };
    const byId = id => document.getElementById(id);
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function fillSelect(id, values) {
      const sel = byId(id);
      for (const v of values) {
        const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
      }
    }
    function render() {
      const family = byId('family').value;
      const benchmark = byId('benchmark').value;
      const model = byId('model').value.toLowerCase();
      const rows = state.rows.filter(r =>
        (!family || r.family === family) &&
        (!benchmark || r.benchmark === benchmark) &&
        (!model || String(r.model).toLowerCase().includes(model))
      );
      byId('count').textContent = `Widoczne rekordy: ${rows.length} / ${state.rows.length}`;
      byId('body').innerHTML = rows.map(r => {
        const src = r.source || {};
        const link = src.url ? `<a href="${esc(src.url)}" target="_blank" rel="noopener">link</a>` : esc(src.path || '');
        const score = r.status === 'null' ? `null: ${esc(r.null_reason || '')}` : esc(r.score);
        return `<tr><td>${esc(r.model)}</td><td>${esc(r.family)}</td><td>${esc(r.benchmark)}</td><td>${esc(r.metric)}</td><td>${score}</td><td>${esc(r.status)}</td><td>${link}</td></tr>`;
      }).join('');
    }
    async function main() {
      const res = await fetch('wyniki.json');
      state.rows = await res.json();
      fillSelect('family', [...new Set(state.rows.map(r => r.family).filter(Boolean))].sort());
      fillSelect('benchmark', [...new Set(state.rows.map(r => r.benchmark).filter(Boolean))].sort());
      ['family','benchmark','model'].forEach(id => byId(id).addEventListener('input', render));
      render();
    }
    main().catch(e => { byId('count').textContent = 'Błąd ładowania wyniki.json: ' + e; });
  </script>
</body>
</html>
